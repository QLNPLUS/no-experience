              if (heading == ver || index(heading, "[" ver "]") == 1) { inside = 1 }
              next
            }
            inside { print }
          ' CHANGELOG.md > changelog-section.md
          if [ ! -s changelog-section.md ]; then
            echo "::error::CHANGELOG.md has no non-empty '## $VERSION' section. Add one before publishing."
            exit 1
          fi
          echo "--- changelog-section.md ---"
          cat changelog-section.md

      - name: Publish to CurseForge and GitHub Releases
        id: publish
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          github-tag: ${{ needs.resolve.outputs.tag }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-commitish: neoforge-1.21.1

          name: No Experience ${{ needs.resolve.outputs.version }} (NeoForge 1.21.1)
          version: ${{ needs.resolve.outputs.version }}
          version-type: ${{ needs.resolve.outputs.version_type }}

          files: build/libs/no_experience-neoforge-1.21.1-${{ needs.resolve.outputs.version }}.jar
          loaders: neoforge
          game-versions: '1.21.1'
          game-version-filter: none

          changelog-file: changelog-section.md
          retry-attempts: 2
          retry-delay: 10000
          fail-mode: fail

      - name: Summarize
        if: always()
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          CF_URL: ${{ steps.publish.outputs.curseforge-url }}
          GH_URL: ${{ steps.publish.outputs.github-url }}
        run: |
          {
            echo "### No Experience ${VERSION} — NeoForge 1.21.1"
            echo
            echo "- CurseForge: ${CF_URL:-not published}"
            echo "- GitHub release: ${GH_URL:-not published}"
            echo
            echo "A CurseForge upload that reported success can stay out of the public file list for several minutes while it is under review. Do not retry on that basis."
          } >> "$GITHUB_STEP_SUMMARY"

  publish-neoforge-126:
    name: Publish NeoForge 26.1.2
    needs: resolve
    if: needs.resolve.outputs.run_neoforge126 == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out ${{ needs.resolve.outputs.ref_neoforge126 }}
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.ref_neoforge126 }}

      - name: Set up JDK 25 (compile toolchain and Gradle JVM)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check the repository configuration
        env:
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CURSEFORGE_PROJECT_ID:-}" ]; then
            echo "::error::Repository variable CURSEFORGE_PROJECT_ID is not set (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          if [ -z "${CURSEFORGE_TOKEN:-}" ]; then
            echo "::error::Repository secret CURSEFORGE_TOKEN is not set (Settings > Secrets and variables > Actions > Secrets)."
