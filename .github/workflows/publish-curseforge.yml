        with:
          ref: ${{ needs.resolve.outputs.ref_neoforge }}

      - name: Set up JDK 21 (compile toolchain and Gradle JVM)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check the repository configuration
        env:
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
