            exit 1
          fi
          if [ -z "${CURSEFORGE_TOKEN:-}" ]; then
            echo "::error::Repository secret CURSEFORGE_TOKEN is not set (Settings > Secrets and variables > Actions > Secrets)."
            exit 1
          fi
          echo "Using CurseForge project id $CURSEFORGE_PROJECT_ID."

      - name: Build
        run: ./gradlew build --no-daemon --no-build-cache --stacktrace

      - name: Check the release artifact
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          expected="build/libs/no_experience-neoforge-1.21.1-${VERSION}.jar"
          echo "--- build/libs ---"
          find build/libs -maxdepth 1 -type f -name '*.jar' -print
          if [ ! -f "$expected" ]; then
            echo "::error::Expected artifact '$expected' was not built. Tag '${{ needs.resolve.outputs.tag }}' names version '$VERSION', so gradle.properties on this branch must carry mod_version=$VERSION."
            exit 1
          fi
          if ! unzip -p "$expected" pack.mcmeta > /dev/null; then
            echo "::error::pack.mcmeta is missing from the root of $expected."
            exit 1
          fi
          if ! unzip -p "$expected" META-INF/neoforge.mods.toml > mod-metadata.toml; then
            echo "::error::META-INF/neoforge.mods.toml is missing from $expected."
            exit 1
          fi
          if grep -q '\${' mod-metadata.toml; then
            echo "::error::An unexpanded \${...} placeholder is still present in META-INF/neoforge.mods.toml."
            exit 1
          fi
