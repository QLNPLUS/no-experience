# Gradle runtime options.
# Minecraft 26.1.2 mods are compiled with Java 25, and Gradle 9.2.1 needs Java 25 to host that
# toolchain; gradle/gradle-daemon-jvm.properties pins the daemon to JDK 25 so `gradlew` works
# from any shell.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Environment properties
minecraft_version=26.1.2
minecraft_version_range=[26.1.2]
# NeoForge 26.1.2.x is the 26.1.2 line.
neo_version=26.1.2.107
neo_version_range=[26.1.2.107,)
loader_version_range=[1,)

# Mod properties
mod_id=no_experience
mod_name=No Experience
mod_license=All Rights Reserved
mod_version=1.0.0
mod_group_id=com.noexperience
mod_authors=QLN
mod_description=Removes experience from the game: mobs drop no XP orbs, players can never gain experience, the stored experience of every player is locked to zero, and the experience bar is hidden on the client.
