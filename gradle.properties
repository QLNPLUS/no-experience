# Gradle runtime options.
# Minecraft 1.20.1 mods are compiled with Java 17, and Gradle 8.8 runs on JDK 17-22;
# gradle/gradle-daemon-jvm.properties pins the daemon to JDK 21 so `gradlew` works from any shell.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Environment properties
minecraft_version=1.20.1
# Only 1.20.1 is supported by this branch.
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.6
# Forge 47.x is the 1.20.1 line.
forge_version_range=[47,)
loader_version_range=[47,)

# Mappings (official = Mojang names shipped with 1.20.1).
mapping_channel=official
mapping_version=1.20.1

# Mod properties
mod_id=no_experience
mod_name=No Experience
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.noexperience
mod_authors=QLN
mod_description=Removes experience from the game: mobs drop no XP orbs, players can never gain experience, the stored experience of every player is locked to zero, and the experience bar is hidden on the client.
